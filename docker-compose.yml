# Plně dockerizované demo. Spuštění jedním příkazem:
#   PUBLIC_HOST=<ip-nebo-domena> docker compose up --build -d
# Lokálně stačí:  docker compose up --build
#
# PUBLIC_HOST  = adresa, na které bude demo veřejně dostupné (default localhost).
# COOKIE_SECURE= 'true' jen když jedeš přes HTTPS (jinak login přes http nefunguje).

x-api-env: &api-env
  NODE_ENV: production
  API_PORT: 3001
  # Pozor: api je i na síti n8n_default, kde je taky kontejner `postgres` (n8n) →
  # DB adresujeme jednoznačně názvem kontejneru, ať nekoliduje DNS. Stejně redis.
  DATABASE_URL: postgres://tagery:tagery@tagery-postgres-1:5432/tagery
  APP_DATABASE_URL: postgres://tagery_app:tagery_app@tagery-postgres-1:5432/tagery
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  REDIS_URL: redis://tagery-redis-1:6379
  STORAGE_DRIVER: local
  STORAGE_LOCAL_PATH: /app/.storage
  # Žádný vestavěný default (M3 hardening): bez vlastní hodnoty v .env má compose
  # spadnout hned se srozumitelnou chybou, ne tiše naběhnout se známým secretem.
  # Nastav v .env (viz .env.example) – i pro lokální demo vygeneruj vlastní hodnotu.
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET musí být nastaven v .env (min. 16 znaků) – viz .env.example}
  BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:?BILLING_WEBHOOK_SECRET musí být nastaven v .env – viz .env.example}
  # Veřejná URL resolveru (do QR/NFC). Za HTTPS proxy: https://app.tagery.tech (→ /r/CODE).
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://${PUBLIC_HOST:-localhost}:3001}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
  PASSWORD_RESET_WEBHOOK_URL: ${PASSWORD_RESET_WEBHOOK_URL:-}
  # AI stažení manuálů přes n8n (viz docs/manual-ai-fetch.md). Prázdné → AI cesta vypnutá.
  MANUAL_FETCH_WEBHOOK_URL: ${MANUAL_FETCH_WEBHOOK_URL:-}
  MANUAL_FETCH_WEBHOOK_SECRET: ${MANUAL_FETCH_WEBHOOK_SECRET:-}
  # Interní adresa API pro callback z n8n (n8n běží v jiném stacku, viz síť n8n_default).
  MANUAL_CALLBACK_BASE_URL: ${MANUAL_CALLBACK_BASE_URL:-}
  # Lokálně výchozí Mailpit; v produkci přepiš skutečným SMTP providerem.
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '8025:8025'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tagery
      POSTGRES_PASSWORD: tagery
      POSTGRES_DB: tagery
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tagery']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Jednorázová služba: migrace schématu + demo data, pak skončí (exit 0).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment: *api-env
    ports:
      - '3001:3001'
    volumes:
      # Perzistentní lokální úložiště médií (fotky věcí) – přežije rebuild/recreate.
      - storage:/app/.storage
    # Kromě výchozí sítě i síť n8n stacku – kvůli AI stažení manuálů (webhook +
    # callback jedou interně, ne přes veřejnou doménu). Viz docs/manual-ai-fetch.md.
    networks:
      - default
      - n8n_default
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Bakuje se do buildu → veřejná URL API (prohlížeč volá /r/CODE, aktivace, nález).
        # Za HTTPS proxy nastav NEXT_PUBLIC_API_URL=https://app.tagery.tech (same-origin přes nginx /r/, žádný mixed-content).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://${PUBLIC_HOST:-localhost}:3001}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side volání web → API uvnitř docker sítě.
      API_URL: http://api:3001
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      # Přes plain http musí být false, jinak se httpOnly cookie nepošle.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
  storage:

networks:
  # Výchozí síť stacku (tagery_default) – vytvoří compose automaticky.
  default:
  # Síť n8n stacku (externí) – kvůli internímu volání webhooku/callbacku AI manuálů.
  n8n_default:
    external: true
