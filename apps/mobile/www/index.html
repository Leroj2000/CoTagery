<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Tagery</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #eef2ff;
        color: #0f172a;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #475569;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a.btn {
        display: inline-block;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 10px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#4f46e5" />
        <rect x="7" y="7" width="7" height="7" rx="1.5" fill="#fff" />
        <rect x="18" y="7" width="7" height="7" rx="1.5" fill="#fff" fill-opacity=".7" />
        <rect x="7" y="18" width="7" height="7" rx="1.5" fill="#fff" fill-opacity=".7" />
        <circle cx="21.5" cy="21.5" r="3.5" fill="#fff" />
      </svg>
      <h1>Načítám Tagery…</h1>
      <p>Aplikace se načítá z app.tagery.tech.</p>
      <a class="btn" href="https://app.tagery.tech/admin">Otevřít Tagery</a>
    </main>
  </body>
</html>
