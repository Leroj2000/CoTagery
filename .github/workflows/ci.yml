name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # BACKLOG QA-01/QA-03: migrace + seed nad čistým PostgreSQL a smoke hlavního průchodu.
  smoke:
    runs-on: ubuntu-latest
    needs: build
    env:
      JWT_SECRET: ci-only-jwt-secret-not-used-in-smoke-000
      BILLING_WEBHOOK_SECRET: ci-only-billing-secret
    steps:
      - uses: actions/checkout@v4

      - name: Build API + migrate + web images
        run: docker compose -p tagery build api migrate web

      - name: Smoke + browser E2E (isolated stack)
        run: tools/smoke/run.sh
